openapi: 3.0.0
info:
  title: Review API
  version: 1.0.0
  description: Đánh giá và phản hồi sau chuyến đi.
paths:
  /reviews:
    post:
      summary: Gửi đánh giá cho chuyến đi/tài xế
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trip_id:
                  type: integer
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Đánh giá thành công
